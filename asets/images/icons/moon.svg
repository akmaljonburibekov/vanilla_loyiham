<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
  <defs>
    <!-- Markaziy sariq gradient -->
    <radialGradient id="moonGlow" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </radialGradient>
    
    <!-- Porlash filtri -->
    <filter id="moonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Porlayotgan oy shakli -->
  <path d="M15.5 10.5C15.5 14.09 12.59 17 9 17C6.73 17 4.73 15.84 3.5 14.08C4.12 14.35 4.8 14.5 5.5 14.5C9.09 14.5 12 11.59 12 8C12 5.86 10.97 3.96 9.38 2.78C13.01 2.92 15.5 6.22 15.5 10.5Z" 
        fill="url(#moonGlow)" 
        stroke="#FFA000" 
        stroke-width="0.5" 
        stroke-linejoin="round"
        filter="url(#moonBlur)" />
</svg>